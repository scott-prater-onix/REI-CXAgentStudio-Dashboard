name: Update Dashboard Data

on:
  schedule:
    # Runs once a day at 11:00 UTC (~7am Toronto/EDT). Adjust the cron expression as needed.
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # allows manual trigger from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the refreshed data

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install smartsheet-python-sdk

      - name: Pull Smartsheet data
        env:
          SMARTSHEET_TOKEN: ${{ secrets.SMARTSHEET_TOKEN }}
          PROJECT_PLAN_SHEET_ID: ${{ secrets.PROJECT_PLAN_SHEET_ID }}
          RAID_LOG_SHEET_ID: ${{ secrets.RAID_LOG_SHEET_ID }}
          PROJECT_COMMENT_SHEET_ID: ${{ secrets.PROJECT_COMMENT_SHEET_ID }}
          OUTPUT_PATH: data/dashboard-data.json
        run: python pull_smartsheet_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard-data.json
          git diff --quiet --cached || git commit -m "Auto-update dashboard data"
          git push
